<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Administrar fotos | La Chocita de Gladis</title><link rel="stylesheet" href="admin.css"></head><body><main class="panel"><a class="back" href="/">← Ver página pública</a><h1>Galería de fotos</h1><p class="intro">Sube, elimina y cambia el orden de las imágenes. Los cambios aparecen en la web al instante.</p><section id="login" class="card"><h2>Acceso privado</h2><form id="login-form"><label>Contraseña <input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button><p id="login-error" class="error" role="alert"></p></form></section><section id="manager" hidden><div class="card upload-card"><h2>Añadir fotos</h2><input id="photos-input" type="file" accept="image/jpeg,image/png,image/webp" multiple><p>JPG, PNG o WebP; máximo 12 MB por foto.</p><p id="upload-status" role="status"></p></div><section><h2>Fotos publicadas</h2><p class="hint">Usa las flechas para cambiar el orden.</p><div id="gallery-list" class="gallery-list"></div></section></section></main><script src="admin.js" defer></script></body></html>
